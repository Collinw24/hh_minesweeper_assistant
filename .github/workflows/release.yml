name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            binary: build/hhms
            asset: hhms-macos
          - os: windows-latest
            binary: build/Release/hhms.exe
            asset: hhms-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DHHMS_BUILD_GUI=ON
      - name: Build
        run: cmake --build build --config Release --target hhms_test hhms
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage release asset
        run: cmake -E copy "${{ matrix.binary }}" "${{ matrix.asset }}"
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: hhms-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
